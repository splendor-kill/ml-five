[project]
name = "ml-five"
version = "0.1.0"
description = "Alphago-like Gomoku AI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "tensorflow",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "six",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tentacle"]

[project.scripts]
ml-five-main = "tentacle.main:main"
ml-five-server = "tentacle.server:main"
