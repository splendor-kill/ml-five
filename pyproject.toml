[project]
name = "ml-five"
version = "0.1.0"
description = "Alphago-like Gomoku AI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "tensorboard",
    "tqdm",
    "setuptools<81",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tentacle"]

[project.scripts]
ml-five = "tentacle.cli:main"
ml-five-main = "tentacle.cli:main_gui_only"
ml-five-server = "tentacle.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
